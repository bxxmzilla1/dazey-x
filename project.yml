# XcodeGen spec — run `xcodegen generate` to (re)create DazeyX.xcodeproj.
# Bundle id / team can also be overridden at build time by build_ipa.sh.
name: DazeyX

options:
  bundleIdPrefix: com.bossing
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # NativeCamera.swift uses GCD + delegate callbacks off the main thread;
    # Xcode 26 templates default to MainActor isolation, which breaks that.
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

targets:
  DazeyX:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DazeyX
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: Photos.framework
      - sdk: PhotosUI.framework
      - sdk: CoreLocation.framework
      - sdk: ImageIO.framework
      - sdk: CoreImage.framework
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bossing.dazeyx
        PRODUCT_NAME: DazeyX
        INFOPLIST_FILE: DazeyX/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    scheme: {}
